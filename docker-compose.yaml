version: '3.8'

services:
  backend:
    build:
      context: ./ctia-be          
      dockerfile: Dockerfile
    container_name: ctia-backend
    ports:
      - "5000:5000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434

  frontend:
    build:
      context: ./ctia-gui         # Points to your frontend folder
      dockerfile: Dockerfile
    container_name: ctia-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000